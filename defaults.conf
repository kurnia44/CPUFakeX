# CPUFakeX — nilai palsu terpusat. Semua lapisan baca dari sini.
enabled=1
spoof_props=1
spoof_cpuinfo=1
spoof_devicetree=1
spoof_soc=1
spoof_cpufreq=1

# --- identitas SoC ---
soc_manufacturer=Qualcomm
soc_model=SM8950
platform=sunridge
board=sunridge
hardware=qcom
marketing=Snapdragon 8 Elite Extreme Gen 6
soc_machine=Qualcomm Technologies, Inc. Sunridge based on SM8950
soc_family=SM8950
dt_model=Qualcomm Technologies, Inc. Sunridge based on SM8950

# --- topologi palsu ---
cores=8
prime_cores=2
prime_max=4752000
perf_max=4200000
min_freq=300000
cpu_variant=0x4
prime_variant=0x5
cpu_part=0x002
prime_part=0x002
bogomips=38.40
cpu_features=fp asimd evtstrm aes pmull sha1 sha2 crc32 atomics fphp asimdhp cpuid asimdrdm jscvt fcma lrcpc dcpop sha3 sm3 sm4 asimddp sha512 asimdfhm dit uscat ilrcpc flagm ssbs paca pacg dcpodp flagm2 frint i8mm bf16 rng bti ecv afp rpres

# --- daemon ---
interval=60

